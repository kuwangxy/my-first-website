<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人网站</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: white;
      line-height: 1.6;
    }
    header {
      padding: 24px;
      font-size: 22px;
      font-weight: bold;
    }
    main {
      max-width: 800px;
      margin: auto;
      padding: 45px 20px;
      text-align: center;
    }
    .avatar {
      width: 90px;
      height: 90px;
      margin: auto;
      border-radius: 50%;
      background: #263f80;
      display: grid;
      place-items: center;
      font-size: 44px;
    }
    h1 {
      font-size: 32px;
      margin-top: 24px;
    }
    p { color: #a5b4cf; }
    .btn {
      display: inline-block;
      margin: 20px 0;
      padding: 12px 26px;
      background: #6366f1;
      color: white;
      border-radius: 10px;
      text-decoration: none;
    }
    .btn:hover { background: #4f46e5; }
    .cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 40px;
      text-align: left;
    }
    .card {
      background: #17243b;
      padding: 24px;
      border-radius: 16px;
    }
    .card h2 { font-size: 20px; }
    footer {
      text-align: center;
      padding: 30px;
      color: #94a3b8;
    }
    @media (max-width: 600px) {
      .cards { grid-template-columns: 1fr; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <header>My Website.</header>
  <main>
    <div class="avatar">👨‍💻</div>
    <h1>你好，欢迎来到我的网站！</h1>
    <p>一个热爱学习、编程与探索新技术的人。</p>
    <a class="btn" href="#about">了解更多 →</a>
    <div class="cards" id="about">
      <div class="card">
        <h2>💻 我的技能</h2>
        <p>HTML · CSS · GitHub</p>
      </div>
      <div class="card">
        <h2>🚀 我的项目</h2>
        <p>持续学习和创造中</p>
      </div>
    </div>
  </main>
  <footer>© 2026 My Website</footer>
</body>
</html>
